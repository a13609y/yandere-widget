name: yande.re 动漫图
description: 从 yande.re / Konachan 按标签取动漫插画，按小组件尺寸匹配画幅；免登录，sample 图 1500px 体积小
author: Cuttlefish
icon: https://raw.githubusercontent.com/a13609y/yandere-widget/main/icon.png
homepage: https://github.com/a13609y/yandere-widget
manual: https://github.com/a13609y/yandere-widget#readme

# 设置项按「内容 / 画幅 / 分级 / 过滤 / 显示」分五组，名字前缀就是分组名
env_schema:
  # ── 内容 ──────────────────────────────────────────────
  TAGS:
    name: 内容 · 标签
    description: "yande.re 只有标签、没有全文搜索；多个标签是「同时满足」，用空格或逗号分隔（blue_sky clouds）。留空 = 随机。中文也行：初音 → hatsune_miku。常见标签：landscape、sky、clouds、hatsune_miku"
    default_value: ""

  SITE:
    name: 内容 · 图源
    description: "自动 = 先查 yande.re，没结果再试 Konachan。Konachan 会按分级自动换域名：只勾「全年龄」走 konachan.net（纯净镜像），勾了「擦边/工口」自动走 konachan.com（实测 .net 完全不返回 q/e）"
    options: ["自动", "yande.re", "Konachan"]

  SORT:
    name: 内容 · 排序
    description: "随机 = 每次抽一批新的（推荐）；热度 = 全站评分降序（会偏老图）；最新 = 发布时间倒序"
    options: ["随机", "热度", "最新"]

  PERIOD:
    name: 内容 · 时段
    description: "只取最近这段时间发布的图。配合「随机/热度」用；选「最新」时自动忽略。时段越短素材越少"
    options: ["不限", "一天内", "一周内", "一个月内", "三个月内", "半年内", "一年内", "两年内", "三年内"]

  MIN_SCORE:
    name: 内容 · 最低评分
    description: "评分低于这个值的直接跳过。0 = 不限制。配合「热度」用比较有意义（一周内的图普遍只有 40~60 分）"
    options: ["0", "50", "100", "200", "500"]

  # ── 画幅 ──────────────────────────────────────────────
  RATIO_STRICT:
    name: 画幅 · 判定严格度
    description: "宽松 = 老的粗分档（≥1.35 横 / 0.75~1.35 方 / <0.75 竖）；严格 = 按理想比例 ±10%（横 1.60~1.96、方 0.90~1.10、竖 0.64~0.78）。严格模式素材会少很多，更容易触发放宽兜底"
    options: ["宽松", "严格"]

  RATIO_SMALL:
    name: 画幅 · 小号
    description: "按实际宽高比：≥1.35 横图、0.75~1.35 方图（近似方也算）、<0.75 竖图"
    options: ["方图", "横图", "竖图", "不限"]
  RATIO_MEDIUM:
    name: 画幅 · 中号
    options: ["方图", "横图", "竖图", "不限"]
  RATIO_LARGE:
    name: 画幅 · 大号
    options: ["方图", "横图", "竖图", "不限"]
  RATIO_XLARGE:
    name: 画幅 · 超大号（iPad）
    options: ["方图", "横图", "竖图", "不限"]

  # ── 分级（s / q / e 三个独立开关，至少留一个）────────────
  SHOW_S:
    name: 分级 · 全年龄（s）
    description: "三个开关自由组合；全关掉会自动按「仅全年龄」处理，不会筛空"
    options: ["true", "false"]
  SHOW_Q:
    name: 分级 · 擦边（q）
    description: "打开后 Konachan 会自动切到 konachan.com（.net 镜像没有 q 级内容）"
    options: ["true", "false"]
  SHOW_E:
    name: 分级 · 工口（e）
    description: "素材最少，单开时可能要多翻几页。同样会切到 konachan.com"
    options: ["true", "false"]

  # ── 过滤 ──────────────────────────────────────────────
  MIN_W:
    name: 过滤 · 最小短边
    description: "图片短边低于这个值的直接跳过，防止拿到糊图"
    options: ["720", "1024", "1280", "1500"]

  EX_NIPPLE:
    name: 过滤 · 露点（nipple/nipples）
    description: "按 _ 分段匹配，erect_nipples、puffy_nipples 也会一起排掉。yande.re 的 rating:s 并不保证没露点，建议一直开着"
    options: ["true", "false"]
  EX_PANTY:
    name: 过滤 · 胖次（panties）
    options: ["true", "false"]
  EX_UNDERWEAR:
    name: 过滤 · 内衣（underwear/bra）
    options: ["true", "false"]
  EX_SEETHROUGH:
    name: 过滤 · 透视（see_through）
    options: ["true", "false"]
  EX_NUDE:
    name: 过滤 · 裸体（nude/topless）
    options: ["true", "false"]
  EX_CAMEL:
    name: 过滤 · 骆驼趾（cameltoe/spread_legs）
    options: ["true", "false"]
  EX_LOLI:
    name: 过滤 · 萝莉正太（loli/shota）
    description: "默认关闭；不看这类就打开，素材会少一截"
    options: ["true", "false"]
  EX_BONDAGE:
    name: 过滤 · 捆绑（bondage）
    options: ["true", "false"]
  EX_PANEL:
    name: 过滤 · 多格/拼图（comic/4koma/collage）
    description: "多格漫画、拼图在小组件里基本看不清，建议一直开着"
    options: ["true", "false"]
  EX_SKETCH:
    name: 过滤 · 草图页/设定集
    options: ["true", "false"]
  EX_PLAINBG:
    name: 过滤 · 白底/纯色底
    description: "white_background / transparent_background（已排除 simple_background，因为它太常见）"
    options: ["true", "false"]
  EXCLUDE_EXTRA:
    name: 过滤 · 自定义标签
    description: "多个用逗号分隔（guro, vore）；标签内部的空格会自动转下划线（erect nipples → erect_nipples）"
    default_value: ""

  # ── 显示 ──────────────────────────────────────────────
  COOLDOWN:
    name: 显示 · 换图间隔
    description: "分钟，0 = 每次刷新都换（实际节奏受 iOS 刷新预算限制）"
    default_value: "30"
  NO_REPEAT:
    name: 显示 · 防重复窗口
    description: "所有尺寸共用一份历史，显示过的作品在这 N 张内不会再出现"
    options: ["50", "100", "200", "500"]
  SHOW_INFO:
    name: 显示 · 分辨率
    description: "左下角显示 分辨率 + 收藏数"
    options: ["true", "false"]
  DEBUG:
    name: 显示 · 调试角标
    description: "一行状态：版本/图源/比例/画幅/分级/体积/排序/时段/异常标记"
    options: ["true", "false"]

scriptings:
  - generic:
      name: YandereWidget
      script_url: https://raw.githubusercontent.com/a13609y/yandere-widget/main/yandere.js
      timeout: 60

widgets:
  - name: 动漫图
    script_name: YandereWidget
    env: {}
