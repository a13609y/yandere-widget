name: Wallhaven 动漫壁纸
description: 从 Wallhaven 取动漫壁纸，按小组件尺寸匹配画幅；免登录可用，R18 需要免费 API Key
author: Cuttlefish
icon: photo.on.rectangle.angled
homepage: https://github.com/a13609y/wallhaven-widget
manual: https://github.com/a13609y/wallhaven-widget#readme

# ── 模块设置页（env_schema 自动生成 UI）────────────────────────
env_schema:
  KEYWORD:
    name: 关键词
    description: "留空 = 随机出图（服务端 random 排序）；填了就按关键词搜索，支持 Wallhaven 语法：girl、landscape、blue_sky、!exact_tag、-排除词"
    default_value: ""

  SORT:
    name: 排序 【有关键词时】
    description: "只在填了关键词时生效；留空关键词一律走随机。相关度=relevance，热度=toplist"
    options: ["相关度", "最新", "热度", "随机"]

  RATIO_SMALL:
    name: 画幅·小号
    description: "方图 = 1:1 为主（含 5:4 / 4:5 近方），横图 = landscape，竖图 = portrait"
    options: ["方图", "横图", "竖图", "不限"]
  RATIO_MEDIUM:
    name: 画幅·中号
    options: ["方图", "横图", "竖图", "不限"]
  RATIO_LARGE:
    name: 画幅·大号
    options: ["方图", "横图", "竖图", "不限"]
  RATIO_XLARGE:
    name: 画幅·超大号（iPad）
    options: ["方图", "横图", "竖图", "不限"]

  PURITY:
    name: 内容分级
    description: "仅 SFW = 纯净；SFW+Sketchy = 加一点擦边；含 R18 必须填 API Key，否则自动降级成 SFW+Sketchy（角标会提示）"
    options: ["仅 SFW", "SFW + Sketchy", "全部（含 R18，需 API Key）"]

  APIKEY:
    name: Wallhaven API Key
    description: "wallhaven.cc → 右上头像 → Account settings → API Key。只在开了 R18 时才会用到"
    default_value: ""

  CATEGORY:
    name: 分类
    description: "动漫 = categories=010；全部 = 010+111（会混进非动漫壁纸）"
    options: ["动漫", "全部"]

  MIN_RES:
    name: 最低分辨率
    description: "服务端 atleast 参数，越高越清晰、库存越少"
    options: ["不限", "1280x720", "1920x1080", "2560x1440"]


  IMG_PROXY:
    name: 缩放服务（可选）
    description: "留空 = 直接下原图。填了就用它缩图，{url} 会被替换成原图地址，例如 https://你的worker.workers.dev/?w=1200&url={url}。Wallhaven 官方缩略图只有 432×243 的横向裁切，第三方免费缩放（wsrv / Photon）又都封了这个域名，所以想要 4K 大图就必须自建一个"
    default_value: ""
  COOLDOWN:
    name: 换图间隔
    description: "分钟；0 = 每次刷新都换（实际节奏受 iOS 刷新预算限制）"
    default_value: "30"
  NO_REPEAT:
    name: 防重复窗口
    description: "所有尺寸共用一份历史，显示过的作品在这 N 张内不会再出现"
    options: ["30", "100", "200", "500"]

  SHOW_INFO:
    name: 显示分辨率
    description: "右下角显示 分辨率 + 热度"
    options: ["true", "false"]
  DEBUG:
    name: 调试角标
    description: "显示一行状态：版本/实际比例/画幅/分级/文件大小/关键词/搜索次数"
    options: ["true", "false"]

scriptings:
  - generic:
      name: WallhavenWidget
      script_url: https://raw.githubusercontent.com/a13609y/wallhaven-widget/main/wallhaven.js
      timeout: 60

widgets:
  - name: 动漫壁纸
    script_name: WallhavenWidget
    env: {}
